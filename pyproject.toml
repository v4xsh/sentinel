[project]
name = "sentinel"
version = "0.1.0"
description = "Agentic fraud investigation on TigerGraph — Hacker House Goa 2026 × TigerGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyTigerGraph>=2.0.4",
    "tigergraph-mcp",
    "langgraph>=0.2",
    "langchain-mcp-adapters",
    "langchain-google-genai>=2.0",
    "google-genai>=0.3",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
